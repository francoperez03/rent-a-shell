# Minimal MediaMTX config for a Forger: RTSP on :8554 (ffmpeg publishes), HLS on :8888 (the gateway serves it at /live).
# mediamtx scripts/forger/mediamtx.yml
logLevel: warn
rtsp: yes
rtspAddress: :8554
hls: yes
hlsAddress: :8888
hlsVariant: fmp4
hlsSegmentDuration: 1s
# The gateway proxies /live/* as a "CDN": with this bearer MediaMTX skips the cookieCheck redirect and per-client sessions.
hlsCDNSecret: rent-a-shell-local
rtmp: no
webrtc: no
srt: no
api: no
paths:
  all_others:
